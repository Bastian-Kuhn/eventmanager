version: "3.3"
services:

  # Versionen fest, damit der Deploy sie bei einer Aenderung zieht. Mongo
  # nur innerhalb von 8.0 anheben, ein Major-Sprung braucht FCV-Schritte.
  redis:
    image: redis:8.10.3
    entrypoint: redis-server --appendonly yes

  mongo:
    # 8.0 startet auf Kernel ab 6.19 nicht (SERVER-121912), zurueck auf 7.0.45 (FCV 7.0)
    image: mongo:7.0.45
    volumes:
      - data_db:/data/db

  application:
    build:
      context: .
    security_opt:
      - no-new-privileges:true
    depends_on:
      - mongo
      - redis
    environment:
      config: base
volumes:
  data_db:
