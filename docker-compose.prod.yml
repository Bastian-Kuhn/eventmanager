version: "3.3"

services:

  # Ohne restart-Policy kommen nach einem Reboot nur die App-Container hoch
  # und laufen ohne Datenbank in 500er.
  redis:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

  mongo:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512

  # security_opt kommt aus docker-compose.yml; doppelt angegeben lehnt
  # Compose v2 die Datei ab, weil es die Listen zusammenfuehrt.
  application:
    restart: unless-stopped
    cap_drop:
      - ALL
    mem_limit: 1500m
    pids_limit: 512
    ports:
      # Pro Instanz eigener Port (in deren .env), Default wie bisher.
      # Nur localhost: nginx davor macht TLS, Docker-Ports umgehen sonst die Firewall.
      - 127.0.0.1:${APP_PORT:-8002}:9090
    environment:
      config: prod_compose
      # Stabiler, geheimer Key - identisch ueber alle Worker und Restarts, sonst
      # funktioniert "Angemeldet bleiben" nicht. Auf dem Host setzen (z.B. .env):
      #   SECRET_KEY=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')
      SECRET_KEY: ${SECRET_KEY:-}
      # Setzt der Deploy: git rev-list --count HEAD (Footer "Build N").
      APP_BUILD: ${APP_BUILD:-}
      # Portal fuer Sektionen und Abrechnung, in der .env der Instanz. Leer = aus.
      PORTAL_HOSTNAME: ${PORTAL_HOSTNAME:-}
      SECTION_BASE_DOMAIN: ${SECTION_BASE_DOMAIN:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SECTION: ${STRIPE_PRICE_SECTION:-}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      # Mailserver fuer Sektionen ohne eigenen und fuers Portal
      PLATFORM_MAIL_SERVER: ${PLATFORM_MAIL_SERVER:-}
      PLATFORM_MAIL_PORT: ${PLATFORM_MAIL_PORT:-}
      PLATFORM_MAIL_USERNAME: ${PLATFORM_MAIL_USERNAME:-}
      PLATFORM_MAIL_PASSWORD: ${PLATFORM_MAIL_PASSWORD:-}
      PLATFORM_MAIL_SENDER: ${PLATFORM_MAIL_SENDER:-}
